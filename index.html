<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parik24</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #e8c84a;
        }
        p {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 36px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #e8c84a, #f0a500);
            color: #000;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            padding: 16px 40px;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(232,200,74,0.35);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(232,200,74,0.2);
        }
        .sub {
            margin-top: 16px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="logo">🎰</div>
    <h1>Parik24</h1>
    <p>Найкращі букмекери України.<br>Бонуси до 10 000 ₴ для нових гравців.</p>
    <button class="btn" id="openBtn">Отримати бонус</button>
    <div class="sub">18+ | Грайте відповідально</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();

        const user = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : {};
        const sub1 = user.id || '';
        const sub2 = user.username || '';
        const sub3 = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) ? tg.initDataUnsafe.start_param : 'tg_mini_app';
        const base = 'https://parik24.top/C42h5d';
        const url = base + '?' + new URLSearchParams({ sub1, sub2, sub3 }).toString();

        document.getElementById('openBtn').addEventListener('click', function() {
            tg.openLink(url);
        });
    </script>
</body>
</html>
