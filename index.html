<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parik24 Debug</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #0f0f1a; color: #fff; font-family: monospace; padding: 16px; }
        pre { font-size: 12px; word-break: break-all; white-space: pre-wrap; background: #1a1a2e; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        button { background: #e8c84a; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        label { color: #aaa; font-size: 11px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {};
        const sub1 = user.id || '';
        const sub2 = user.username || '';
        const sub3 = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) ? tg.initDataUnsafe.start_param : 'tg_mini_app';
        const url = 'https://parik24.top/C42h5d?' + new URLSearchParams({ sub1, sub2, sub3 });

        document.write(`
            <label>initDataUnsafe:</label>
            <pre>${JSON.stringify(tg.initDataUnsafe, null, 2)}</pre>
            <label>URL що відкриється:</label>
            <pre>${url}</pre>
            <button onclick="window.location.replace('${url}')">▶ Перейти</button>
        `);
    </script>
</body>
</html>
